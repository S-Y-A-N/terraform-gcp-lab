name: Terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"

# Least privilege: the default token can only read the repo.
permissions:
  contents: read

# One run per branch; a newer push cancels the older run.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In production, pin third-party actions to a full commit SHA.
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}

      - name: Create plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Check formatting
        run: terraform fmt -check -recursive

      # No cloud credentials needed: skip the remote backend.
      - name: Initialize (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs only on pull requests, and only once the GCP repository
    # variables below are set. Otherwise it is skipped, not failed.
    if: >-
      github.event_name == 'pull_request' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != ''
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token from GitHub
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}

      - name: Create plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # Keyless auth: Workload Identity Federation, no stored JSON key.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Initialize
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -no-color